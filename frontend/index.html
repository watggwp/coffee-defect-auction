<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="ประมูลเมล็ดกาแฟจากผลตรวจ AI แบบ real-time" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ประมูลเมล็ดกาแฟ</title>
    <script>
      // กัน flash ของธีมผิดสำหรับคนที่เลือกธีมเองไว้ (ต้องเป็น inline script ไม่ใช่ module/defer)
      {
        const s = localStorage.getItem("color-scheme");
        if (s === "light" || s === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = s;
          document.documentElement.dataset.theme = s;
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
